context:
  version: "0.3.0"

package:
  name: libghostty-py
  version: ${{ version }}

source:
  url: https://github.com/davidbrochart/libghostty-py/archive/refs/tags/v${{ version }}.tar.gz
  sha256: edaafbc5c13f6a2efb172cc4a0636e18e3927adabdceacd5f38b103e0ade9320

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation --config-settings=bundle=false

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - cffi
    - libghostty-vt ==0.1.0.dev

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - ghostty
      pip_check: true
  - script: pytest -q tests/test_core.py tests/test_serialize.py
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    files:
      source:
        - tests/test_core.py
        - tests/test_serialize.py

about:
  homepage: https://github.com/davidbrochart/libghostty-py
  summary: Python bindings for the Ghostty terminal emulation library
  license: Apache-2.0 AND MIT
  license_file:
    - LICENSE
    - LICENSE.ghostty
  repository: https://github.com/davidbrochart/libghostty-py

extra:
  recipe-maintainers:
    - davidbrochart
